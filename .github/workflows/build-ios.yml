name: Build iOS App

on: [push]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Gebruikt de juiste Node.js versie om waarschuwingen te voorkomen

      - name: Installeer dependencies
        run: npm install

      # Stempel de build met de commit, zodat de app zelf kan zeggen
      # welke versie erop staat. Moet vóór prebuild, want daarna wordt de
      # JS-bundel samengesteld.
      - name: Schrijf build-informatie
        run: node scripts/write-build-info.mjs

      - name: Expo Prebuild (Genereer iOS map)
        run: npx expo prebuild --platform ios

      - name: Bouw de iOS app (Unsigned)
        run: |
          cd ios
          # Zoek automatisch de naam van de gegenereerde workspace
          WORKSPACE_NAME=$(ls | grep '\.xcworkspace$' | head -1)
          SCHEME_NAME=$(basename "$WORKSPACE_NAME" .xcworkspace)
          
          # Bouw de app zonder handtekening
          xcodebuild -workspace "$WORKSPACE_NAME" -scheme "$SCHEME_NAME" -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Verpak de app in een .ipa bestand
        run: |
          cd ios/build/Build/Products/Release-iphoneos
          # Zoek de gegenereerde .app map
          APP_NAME=$(ls | grep '\.app$' | head -1)
          
          # Creëer de Payload map (vereist voor een geldig .ipa bestand)
          mkdir Payload
          mv "$APP_NAME" Payload/
          zip -q -r -y app.ipa Payload

      - name: Upload het .ipa bestand naar GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: ios/build/Build/Products/Release-iphoneos/app.ipa